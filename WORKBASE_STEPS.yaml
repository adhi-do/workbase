# ==============================================================================
# WORKBASE: STEP-BY-STEP TECHNICAL STUDY GUIDE (YAML)
# Unified Digital Operations Platform — GPS Geofence Verification & Management
# Zero Framework Frontend: 100% Free of React, Tailwind, and Java.
# ==============================================================================

project_overview:
  name: "Workbase"
  tagline: "Unified digital operations platform with anti-proxy GPS verification"
  core_purpose: "Eliminate proxy attendance via server-side GPS math while providing an expandable foundation for enterprise task allocation and institutional resource tracking."
  tech_stack:
    backend: "Python 3 (Flask 3.0.3, Werkzeug, Gunicorn)"
    database: "SQLite 3 with Foreign Key Enforcement & Performance Indexes"
    security: "PBKDF2-HMAC-SHA256 (260k rounds), Flask-WTF CSRF Protection, HTTPOnly/SameSite Lax Cookies"
    frontend: "Semantic HTML5, Modern Vanilla CSS (CSS Variables), Vanilla JavaScript (Fetch API)"
    framework_guarantee: "Strictly 0% React, 0% Tailwind, 0% Java. Zero node_modules or bloated build steps."

